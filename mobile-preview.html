<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 Abigail Morra — Mobile iPhone Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at top, #1800ad 0%, #090042 100%);
      min-height: 100vh;
      font-family: 'Space Mono', monospace;
      color: white;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .font-cute {
      font-family: 'Gaegu', cursive;
    }
    .iphone-shell {
      position: relative;
      background: #141416;
      border-radius: 54px;
      padding: 14px;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.75),
        0 0 0 3px #3f3f46,
        0 0 0 6px #fde047,
        inset 0 0 8px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dynamic-island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 26px;
      background: #000;
      border-radius: 999px;
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }
    .dynamic-island::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e3a8a 30%, #090d16 70%);
    }
    .screen-frame {
      width: 393px;
      height: 852px;
      border-radius: 40px;
      overflow: hidden;
      background: #faf8f5;
      border: 1px solid rgba(255,255,255,0.12);
      transition: width 0.3s ease, height 0.3s ease;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .device-btn {
      font-family: 'Gaegu', cursive;
      font-size: 1.15rem;
      padding: 4px 14px;
      border-radius: 999px;
      border: 2px solid rgba(253, 224, 71, 0.6);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .device-btn:hover, .device-btn.active {
      background: #fde047;
      color: #1800ad;
      border-color: #fde047;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Top Controls Bar -->
  <div class="flex flex-wrap items-center justify-center gap-3 mb-4 bg-white/10 backdrop-blur-md px-5 py-2.5 rounded-full border border-white/20 shadow-lg">
    <span class="font-cute text-2xl text-[#fde047] mr-2">📱 Mobile Studio Preview</span>
    <button class="device-btn active" onclick="setSize(393, 852, this)">iPhone 15 Pro (393×852)</button>
    <button class="device-btn" onclick="setSize(375, 667, this)">iPhone Mini / SE (375×667)</button>
    <button class="device-btn" onclick="setSize(430, 932, this)">iPhone Pro Max (430×932)</button>
    <button class="device-btn" onclick="setSize(768, 1024, this)">iPad Mini (768×1024)</button>
    <button class="device-btn" onclick="reloadFrame()">↻ Refresh</button>
  </div>

  <!-- iPhone Frame -->
  <div class="iphone-shell">
    <div class="dynamic-island"></div>
    <div id="phone-screen" class="screen-frame">
      <iframe id="portfolio-iframe" src="./index.html?mobilePreview=1"></iframe>
    </div>
  </div>

  <p class="mt-3 text-xs text-blue-200 font-cute text-lg">
    ✨ Everything inside the phone is 100% interactive — click books, peel stickers, and test your games!
  </p>

  <script>
    function setSize(w, h, btn) {
      const screen = document.getElementById('phone-screen');
      screen.style.width = w + 'px';
      screen.style.height = h + 'px';
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
    function reloadFrame() {
      const frame = document.getElementById('portfolio-iframe');
      frame.src = './index.html?t=' + Date.now();
    }
  </script>
</body>
</html>
